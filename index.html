<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particles - Hand Control Debug</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
            color: white;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        /* Esconde o vídeo bruto, usaremos o canvas de debug */
        #input-video { display: none; }

        /* Painel de UI */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            width: 240px;
        }
        .btn {
            background: rgba(255,255,255,0.1); border: none;
            padding: 8px; border-radius: 6px; color: white;
            cursor: pointer; width: 48%; margin-bottom: 5px;
        }
        .btn:hover { background: rgba(255,255,255,0.3); }
        .btn.active { background: white; color: black; font-weight: bold; }
        
        /* Debug View - O Espelho Mágico */
        #debug-container {
            position: absolute; bottom: 20px; right: 20px; z-index: 20;
            width: 200px; height: 150px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        #output-canvas {
            width: 100%; height: 100%;
            transform: scaleX(-1); /* Espelhar a imagem para ficar natural */
        }
        
        #status-msg {
            position: absolute; bottom: 180px; right: 20px; z-index: 20;
            text-align: right; font-size: 0.9rem; color: #aaa;
        }
        .info { font-size: 0.8rem; color: #ccc; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Elementos de Mídia -->
    <video id="input-video"></video>
    
    <!-- 3D Scene -->
    <div id="canvas-container"></div>

    <!-- UI -->
    <div id="ui-panel">
        <h2 style="margin:0 0 10px 0; font-size:1.2rem">Controle Manual</h2>
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between">
            <button class="btn active" onclick="setTemplate('hearts')">Corações</button>
            <button class="btn" onclick="setTemplate('flowers')">Flores</button>
            <button class="btn" onclick="setTemplate('saturn')">Saturno</button>
            <button class="btn" onclick="setTemplate('fireworks')">Fogos</button>
        </div>
        <div style="margin-top:10px">
            <label>Cor:</label> 
            <input type="color" id="colorPicker" value="#ff0055" style="border:none; background:none; cursor:pointer">
        </div>
        <div class="info">
            👋 <b>2 Mãos:</b> Afaste para expandir.<br>
            ✊ <b>Fechar mão:</b> Vibração/Caos.
        </div>
    </div>

    <!-- Debug View (Para ver se a camera te enxerga) -->
    <div id="status-msg">Iniciando câmera...</div>
    <div id="debug-container">
        <canvas id="output-canvas"></canvas>
    </div>

    <!-- Bibliotecas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        // --- CONFIGURAÇÃO INICIAL ---
        const config = {
            particleCount: 2000,
            template: 'hearts',
            expansion: 1.0,
            tension: 0.0,
            color: new THREE.Color('#ff0055')
        };

        // --- THREE.JS (Visual 3D) ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 60;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Texturas Geradas via Código
        function makeTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            
            if(type === 'heart') {
                ctx.font = "50px Arial"; ctx.fillText("♥", 10, 50);
            } else if(type === 'flower') {
                ctx.font = "50px Arial"; ctx.fillText("✿", 10, 50);
            } else {
                // Glow
                const grad = ctx.createRadialGradient(32,32,0,32,32,32);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,64,64);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const mat = new THREE.PointsMaterial({
            size: 2,
            map: makeTexture('heart'),
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            color: config.color
        });

        // Criar Partículas
        const geo = new THREE.BufferGeometry();
        const pos = []; const rnd = []; const vel = [];
        for(let i=0; i<config.particleCount; i++){
            pos.push((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
            rnd.push(Math.random());
            vel.push(0,0,0);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('random', new THREE.Float32BufferAttribute(rnd, 1));
        const particles = new THREE.Points(geo, mat);
        scene.add(particles);

        // Loop de Animação
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;

            const positions = geo.attributes.position.array;
            const randoms = geo.attributes.random.array;
            
            // Fatores de controle suavizados
            const EXP = Math.max(0.2, config.expansion);
            const CHAOS = 1 + (config.tension * 5);

            for(let i=0; i<config.particleCount; i++){
                let ix = i*3, iy = i*3+1, iz = i*3+2;
                let x = positions[ix], y = positions[iy], z = positions[iz];

                if(config.template === 'hearts' || config.template === 'flowers') {
                    // Movimento flutuante suave
                    y += (0.1 + randoms[i]*0.1) * CHAOS; 
                    if(y > 30*EXP) y = -30*EXP;

                    // Expansão: Puxa para o centro se EXP for baixo, empurra se for alto
                    x = x * 0.95 + (x * EXP) * 0.05;
                    y = y * 0.95 + (y * EXP) * 0.05;
                    z = z * 0.95 + (z * EXP) * 0.05;
                } 
                else if (config.template === 'saturn') {
                    // Rotação em anel
                    const r = (15 + randoms[i]*20) * EXP;
                    const angle = time + randoms[i]*10;
                    const tx = Math.cos(angle) * r;
                    const tz = Math.sin(angle) * r;
                    
                    x += (tx - x) * 0.1;
                    z += (tz - z) * 0.1;
                    y += (Math.sin(time*3 + i)*CHAOS - y) * 0.1;
                }
                else { // Fireworks
                    const d = Math.sqrt(x*x+y*y+z*z);
                    if(d > 40*EXP || Math.random() < 0.01) {
                        x=0; y=0; z=0; // Reset
                        vel[ix] = (Math.random()-0.5)*CHAOS;
                        vel[iy] = (Math.random()-0.5)*CHAOS;
                        vel[iz] = (Math.random()-0.5)*CHAOS;
                    }
                    x += vel[ix]; y += vel[iy]; z += vel[iz];
                }

                positions[ix] = x; positions[iy] = y; positions[iz] = z;
            }
            geo.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }
        animate();

        // --- INTERAÇÃO COM A UI ---
        window.setTemplate = (t) => {
            config.template = t;
            if(t === 'hearts') mat.map = makeTexture('heart');
            else if(t === 'flowers') mat.map = makeTexture('flower');
            else mat.map = makeTexture('spark');
            
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            mat.color.set(e.target.value);
        });

        // --- MEDIAPIPE (A Parte da Câmera) ---
        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusMsg = document.getElementById('status-msg');

        function onResults(results) {
            // 1. Desenhar no Canvas de Debug (Canto inferior direito)
            canvasElement.width = results.image.width;
            canvasElement.height = results.image.height;
            canvasCtx.save();
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusMsg.innerText = "Mãos detectadas! 👋";
                statusMsg.style.color = "#4f4";
                
                const hands = results.multiHandLandmarks;

                // Desenhar o esqueleto da mão (Debugging)
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2});
                }

                // Lógica 1: Tensão (Mão Fechada vs Aberta)
                // Pegamos a primeira mão
                const h1 = hands[0];
                const wrist = h1[0];
                const tip = h1[12]; // Ponta do dedo médio
                
                // Distância punho até ponta do dedo
                const handSize = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                
                // Se handSize < 0.2 (fechada) -> Tensão alta. Se > 0.4 (aberta) -> Tensão baixa
                // Ajustei a sensibilidade aqui:
                let currentTension = 0;
                if(handSize < 0.25) currentTension = 1.0; // Fechada
                else if(handSize > 0.4) currentTension = 0.0; // Aberta
                else currentTension = 1 - ((handSize - 0.25) / 0.15); // Intermediário
                
                // Suavização (Lerp)
                config.tension += (currentTension - config.tension) * 0.1;

                // Lógica 2: Expansão (Distância entre duas mãos)
                if(hands.length === 2) {
                    const h2 = hands[1];
                    // Distância entre pulsos
                    const dist = Math.hypot(h1[0].x - h2[0].x, h1[0].y - h2[0].y);
                    
                    // Mapeia distância (0.2 a 0.8) para expansão (0.5 a 3.0)
                    let targetExp = dist * 4.0;
                    config.expansion += (targetExp - config.expansion) * 0.1;
                }

            } else {
                statusMsg.innerText = "Procurando mãos...";
                statusMsg.style.color = "#aaa";
                // Voltar ao normal se perder as mãos
                config.expansion += (1.0 - config.expansion) * 0.05;
                config.tension += (0.0 - config.tension) * 0.05;
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // Inicialização da câmera
        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320, // Resolução menor para ficar mais rápido
            height: 240
        });
        cameraFeed.start();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
